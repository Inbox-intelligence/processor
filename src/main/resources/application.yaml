server:
  port: 8081

spring:
  application:
    name: processor

  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
    email-event:
      exchange: ${RABBITMQ_EMAIL_EVENT_EXCHANGE}
      sanitization-queue: ${RABBITMQ_EMAIL_SANITIZATION_QUEUE}
      sanitization-routing-key: ${RABBITMQ_EMAIL_SANITIZATION_ROUTING_KEY}
      normalization-queue: ${RABBITMQ_EMAIL_NORMALIZATION_QUEUE}
      normalization-routing-key: ${RABBITMQ_EMAIL_NORMALIZATION_ROUTING_KEY}
      embedding-queue: ${RABBITMQ_EMAIL_EMBEDDING_QUEUE}
      embedding-routing-key: ${RABBITMQ_EMAIL_EMBEDDING_ROUTING_KEY}
      clustering-queue: ${RABBITMQ_EMAIL_CLUSTERING_QUEUE}
      clustering-routing-key: ${RABBITMQ_EMAIL_CLUSTERING_ROUTING_KEY}

redis-lock:
  key-prefix: ${REDIS_BATCH_CLUSTERING_LOCK_KEY_PREFIX}

clustering:
  incremental:
    min-similarity-threshold: ${CLUSTERING_MIN_SIMILARITY_THRESHOLD}

email-storage-provider:
  name: ${EMAIL_STORAGE_PROVIDER_NAME}
  local-base-path: ${EMAIL_STORAGE_LOCAL_BASE_PATH}

model-porvider:
  embedding-provider-name: ${EMBEDDING_PROVIDER_NAME}
  llm-provider-name: ${LLM_PROVIDER_NAME}
  ollama:
    embedding:
      url: ${OLLAMA_EMBEDDING_URL}
      model-name: ${OLLAMA_EMBEDDING_MODEL}
    llm:
      url: ${OLLAMA_LLM_URL}
      model-name: ${OLLAMA_LLM_MODEL}
  bedrock:
    url: ${BEDROCK_URL}
    api-key: ${BEDROCK_API_KEY}
    embedding:
      model-name: ${BEDROCK_EMBEDDING_MODEL_NAME}
      dimensions: ${BEDROCK_EMBEDDING_DIMENSIONS}
      normalize: ${BEDROCK_EMBEDDING_NORMALIZE}
    llm:
      model-name: ${BEDROCK_LLM_MODEL_NAME}

resilience4j:
  retry:
    instances:
      aiRetry:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.inboxintelligence.processor.exception.RetryableAIException

sanitization:
  quoted-text-patterns:
    - "(?m)^On .{10,80}<[^>]+>\\s*wrote:\\s*$"
    - "(?m)^On .{10,80} wrote:\\s*$"
    - "(?m)^-{3,}\\s*Original Message\\s*-{3,}"
    - "(?ms)^From:\\s.*\\nSent:\\s.*\\nTo:\\s.*"
    - "(?m)^_{3,}\\s*$"
  signature-patterns:
    - "^-- ?$"
    - "(?i)^Sent from my (iPhone|iPad|Galaxy|Samsung)"
    - "(?i)^Sent from Mail for Windows"
    - "(?i)^Get Outlook for (iOS|Android)"
    - "(?i)^Sent from Yahoo Mail"
  sign-off-phrases:
    - "best regards"
    - "kind regards"
    - "warm regards"
    - "regards"
    - "thanks"
    - "thank you"
    - "cheers"
    - "sincerely"
    - "respectfully"
    - "best"
  disclaimer-keywords:
    - "confidential"
    - "privileged"
    - "intended recipient"
    - "unauthorized"
    - "disclaimer"
    - "this email"
    - "this message"
    - "please notify"
    - "delete this"
    - "legally privileged"

logging:
  level:
    root: WARN
    com.inboxintelligence: INFO
    com.inboxintelligence.processor: INFO
    org.springframework: WARN
    org.springframework.amqp: WARN
    org.springframework.boot: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
